# ============================================================
# ztb_clean MySQL 数据库 — Docker Compose 部署配置
# 用途：为招投标智能助手项目提供结构化数据存储
# 数据库：ztb_clean（4 张表，约 7.4 万行，~95MB）
# ============================================================
# 使用方式：
#   启动:  docker compose -f docker/mysql/docker-compose.yml up -d
#   停止:  docker compose -f docker/mysql/docker-compose.yml down
#   重建:  docker compose -f docker/mysql/docker-compose.yml down -v
# ============================================================

services:
  mysql:
    image: mysql:8.0.46
    container_name: ztb_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      MYSQL_DATABASE: ztb_clean
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      # 数据持久化：MySQL 数据文件存储于项目级目录
      - ./mysql_data:/var/lib/mysql
      # 初始化脚本：首次启动时自动执行 schema.sql
      - ./init:/docker-entrypoint-initdb.d
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
      - --max-allowed-packet=256M
      - --innodb-buffer-pool-size=512M
      - --innodb-log-file-size=256M
      - --innodb-flush-log-at-trx-commit=2
      - --max-connections=200
      - --wait-timeout=28800
      - --interactive-timeout=28800
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-123456}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - ztb_network

networks:
  ztb_network:
    name: ztb_network
    driver: bridge
