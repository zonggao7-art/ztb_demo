# ============================================================
# 新版 Milvus v2.6 POC 栈 — 与生产 2.4.0 完全并行隔离
# 宿主机端口: gRPC 19531 / health 9093 / etcd 2380 / minio 9003,9004
# 数据卷:     ./volumes-v26/*（独立目录，可整体删除不影响旧栈）
# 启动:       docker compose -p milvus-v26 -f docker-compose-v26.yml up -d
# 铁律:       不复用旧栈的任何容器名、端口、卷
# ============================================================

services:
  etcd:
    container_name: milvus-etcd-v26
    image: quay.io/coreos/etcd:v3.5.5
    restart: unless-stopped
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - ./volumes-v26/etcd:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3
    ports:
      - "2380:2379"

  minio:
    container_name: milvus-minio-v26
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9003:9000"
      - "9004:9001"
    volumes:
      - ./volumes-v26/minio:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  standalone:
    container_name: milvus-standalone-v26
    image: milvusdb/milvus:v2.6.23
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: minioadmin
      MINIO_SECRET_ACCESS_KEY: minioadmin
    volumes:
      - ./volumes-v26/milvus:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    ports:
      - "19531:19530"   # gRPC（宿主机 19531 → 容器内 19530）
      - "9093:9091"     # health/metrics
    depends_on:
      - etcd
      - minio

